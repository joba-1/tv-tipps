<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TV Tipps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="TV Tipps">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body x-data="tvApp()" x-init="init()">

  <!-- Navigation -->
  <nav class="container-fluid">
    <ul>
      <li><strong>TV Tipps</strong></li>
    </ul>
    <ul>
      <li>
        <details class="dropdown">
          <summary x-text="{'recs': t('nav.tips'), 'now': t('nav.now_next'), 'epg': t('nav.epg'), 'admin': t('nav.admin'), 'remote': t('nav.remote')}[page] || t('nav.tips')"></summary>
          <ul>
            <li><a href="#recs"   @click="$el.closest('details').removeAttribute('open')" x-text="t('nav.tips')"     :style="page==='recs'   ? 'font-weight:bold' : ''"></a></li>
            <li><a href="#now"    @click="$el.closest('details').removeAttribute('open')" x-text="t('nav.now_next')" :style="page==='now'    ? 'font-weight:bold' : ''"></a></li>
            <li><a href="#epg"    @click="$el.closest('details').removeAttribute('open')" x-text="t('nav.epg')"     :style="page==='epg'    ? 'font-weight:bold' : ''"></a></li>
            <li><a href="#remote" @click="$el.closest('details').removeAttribute('open')" x-text="t('nav.remote')"  :style="page==='remote' ? 'font-weight:bold' : ''"></a></li>
            <li><a href="#admin"  @click="$el.closest('details').removeAttribute('open')" x-text="t('nav.admin')"   :style="page==='admin'  ? 'font-weight:bold' : ''"></a></li>
          </ul>
        </details>
      </li>
      <li>
        <details class="dropdown">
          <summary x-text="currentUser ? currentUser.name : t('nav.user_label')"></summary>
          <ul>
            <template x-for="u in users" :key="u.slug">
              <li><a href="#" @click.prevent="setUser(u.slug); $el.closest('details').removeAttribute('open')" x-text="u.name"
                     :style="currentUser && currentUser.slug===u.slug ? 'font-weight:bold' : ''"></a></li>
            </template>
          </ul>
        </details>
      </li>
      <li>
        <details class="dropdown">
          <summary>
            <span class="state-dot" x-show="selectedReceiver"
                  :class="selectedReceiver ? (selectedReceiver.online ? (selectedReceiver.power_state==='on' ? 'online' : 'standby') : (selectedReceiver.power_state==='off' ? 'off' : 'offline')) : ''"></span>
            <span x-text="selectedReceiver ? (selectedReceiver.location || selectedReceiver.name) : t('nav.receiver_label')"></span>
          </summary>
          <ul>
            <li><a href="#" @click.prevent="setReceiver(null); $el.closest('details').removeAttribute('open')"
                   :style="!selectedReceiver ? 'font-weight:bold' : ''"
                   x-text="t('nav.receiver_label')"></a></li>
            <template x-for="r in receivers" :key="r.name">
              <li><a href="#" @click.prevent="setReceiver(r.name); $el.closest('details').removeAttribute('open')"
                     :style="selectedReceiver && selectedReceiver.name===r.name ? 'font-weight:bold' : ''">
                <span class="state-dot" :class="r.online ? (r.power_state==='on' ? 'online' : 'standby') : (r.power_state==='off' ? 'off' : 'offline')"></span>
                <span x-text="r.location || r.name"></span>
              </a></li>
            </template>
          </ul>
        </details>
      </li>
    </ul>
  </nav>

  <!-- i18n pending banner -->
  <div class="container-fluid i18n-pending-banner" x-show="i18nStatus === 'pending'" x-transition
       x-text="t('msg.translation_pending')"></div>

  <!-- Stale data banner -->
  <div class="container-fluid stale-banner" x-show="staleBanner && page !== 'admin'" x-transition
       x-text="t('msg.stale')"></div>

  <!-- ★ Recommendations page (default) -->
  <main class="container" x-show="page==='recs'">
    <div class="page-header">
      <h2 x-text="t('page.tips.title')"></h2>
      <details class="dropdown context-dropdown">
        <summary x-text="{'now': t('context.now'), 'next': t('context.next'), 'prime': t('context.prime'), 'today': t('context.today')}[recsContext]"></summary>
        <ul>
          <li><a href="#" @click.prevent="setRecsContext('now');  $el.closest('details').removeAttribute('open')" x-text="t('context.now')"   :style="recsContext==='now'   ? 'font-weight:bold' : ''"></a></li>
          <li><a href="#" @click.prevent="setRecsContext('next'); $el.closest('details').removeAttribute('open')" x-text="t('context.next')"  :style="recsContext==='next'  ? 'font-weight:bold' : ''"></a></li>
          <li><a href="#" @click.prevent="setRecsContext('prime');$el.closest('details').removeAttribute('open')" x-text="t('context.prime')" :style="recsContext==='prime' ? 'font-weight:bold' : ''"></a></li>
          <li><a href="#" @click.prevent="setRecsContext('today');$el.closest('details').removeAttribute('open')" x-text="t('context.today')" :style="recsContext==='today' ? 'font-weight:bold' : ''"></a></li>
        </ul>
      </details>
      <button class="outline secondary refresh-btn" @click="loadRecs()" :aria-busy="loadingRecs"
              x-text="t('btn.refresh')"></button>
    </div>

    <div x-show="recsData && recsData.cold_start" class="cold-start-banner"
         x-text="t('msg.cold_start')"></div>

    <p x-show="recsData && recsData.taste_summary" class="taste-summary"
       x-text="recsData && recsData.taste_summary"></p>

    <div x-show="loadingRecs" aria-busy="true" class="loading-center"
         x-text="t('msg.loading_tips')"></div>

    <div class="event-list" x-show="!loadingRecs">
      <template x-for="(rec, idx) in (recsData && recsData.recommendations || [])"
                :key="rec.sref + idx">
        <article class="event-row" :class="isLive(rec) ? 'live' : ''"
                 @click="showDetail(rec, rec.channel_name)" role="button">
          <div class="event-meta">
            <div class="event-time"
                 x-text="formatTime(rec.start_time) + ' – ' + formatTime(rec.end_time)"></div>
            <div class="event-progress" x-show="isLive(rec)"
                 :title="t('label.progress', { pct: Math.round(progressPct(rec)) })">
              <div class="event-progress-fill"
                   :style="'width:' + progressPct(rec) + '%'"></div>
            </div>
            <div class="event-channel" x-text="rec.channel_name"></div>
            <span class="event-match"
                  :class="rec.match_score >= 0.75 ? 'high' : rec.match_score >= 0.5 ? 'mid' : 'low'"
                  x-text="t('label.match', { pct: Math.round(rec.match_score*100) })"></span>
          </div>
          <div class="event-content">
            <div class="event-title-row">
              <span class="event-title" x-text="rec.title"></span>
            </div>
            <div class="event-desc" x-show="rec.short_desc" x-text="rec.short_desc"></div>
            <div class="event-reason" x-show="rec.reason" x-text="rec.reason"></div>
          </div>
        </article>
      </template>
      <div x-show="(!recsData || !recsData.recommendations || recsData.recommendations.length===0)
                   && !loadingRecs"
           class="empty-state" x-text="t('msg.no_recs')"></div>
    </div>

    <!-- Zap feedback toast -->
    <div class="toast" x-show="zapToast" x-transition x-text="zapToast"></div>
  </main>

  <!-- Now & Next page -->
  <main class="container" x-show="page==='now'">
    <div class="page-header">
      <h2 x-text="t('page.now.title')"></h2>
      <small x-text="t('label.updated', { time: lastRefresh })"></small>
      <button class="outline secondary refresh-btn" @click="loadNowNext()" :aria-busy="loadingNow"
              x-text="t('btn.refresh')"></button>
    </div>

    <div x-show="loadingNow" aria-busy="true" class="loading-center"
         x-text="t('msg.loading_epg')"></div>

    <div class="event-list" x-show="!loadingNow">
      <template x-for="ev in nowNextFlat" :key="ev.sref + ':' + ev._kind + ':' + ev.id">
        <article class="event-row" :class="isLive(ev) ? 'live' : ''"
                 :data-end="ev.end_time"
                 @click="showDetail(ev, ev.channel_name, ev.sref)" role="button">
          <div class="event-meta">
            <div class="event-time"
                 x-text="formatTime(ev.start_time) + ' – ' + formatTime(ev.end_time)"></div>
            <div class="event-progress" x-show="isLive(ev)"
                 :title="t('label.progress', { pct: Math.round(progressPct(ev)) })">
              <div class="event-progress-fill"
                   :style="'width:' + progressPct(ev) + '%'"></div>
            </div>
            <div class="event-channel" x-text="ev.channel_name"></div>
            <span class="event-match" x-show="recsMatch(ev.id) !== undefined"
                  :class="recsMatch(ev.id) >= 0.75 ? 'high' : recsMatch(ev.id) >= 0.5 ? 'mid' : 'low'"
                  x-text="t('label.match', { pct: Math.round((recsMatch(ev.id) || 0) * 100) })"></span>
          </div>
          <div class="event-content">
            <div class="event-title-row">
              <span class="event-title" x-text="ev.title"></span>
              <span class="event-kind-badge" x-show="ev._kind === 'next'"
                    x-text="t('label.next_prefix')"></span>
            </div>
            <div class="event-desc" x-show="ev.short_desc || ev.long_desc"
                 x-text="ev.short_desc || ev.long_desc"></div>
          </div>
        </article>
      </template>
    </div>

    <div x-show="!loadingNow && nowNext.length === 0"
         class="empty-state" x-text="t('msg.no_channels')"></div>
  </main>

  <!-- EPG range page -->
  <main class="container" x-show="page==='epg'">
    <div class="page-header">
      <h2 x-text="t('page.epg.title')"></h2>
      <details class="dropdown context-dropdown">
        <summary x-text="{'4h': t('label.epg_4h'), 'tonight': t('label.epg_tonight'), 'all': t('label.epg_all')}[epgContext]"></summary>
        <ul>
          <li><a href="#" @click.prevent="setEpgContext('4h');      $el.closest('details').removeAttribute('open')" x-text="t('label.epg_4h')"      :style="epgContext==='4h'      ? 'font-weight:bold' : ''"></a></li>
          <li><a href="#" @click.prevent="setEpgContext('tonight'); $el.closest('details').removeAttribute('open')" x-text="t('label.epg_tonight')" :style="epgContext==='tonight' ? 'font-weight:bold' : ''"></a></li>
          <li><a href="#" @click.prevent="setEpgContext('all');     $el.closest('details').removeAttribute('open')" x-text="t('label.epg_all')"     :style="epgContext==='all'     ? 'font-weight:bold' : ''"></a></li>
        </ul>
      </details>
      <button class="outline secondary refresh-btn" @click="loadEpg()" :aria-busy="loadingEpg"
              x-text="t('btn.refresh')"></button>
    </div>

    <input type="search" class="epg-search-input"
           x-model="epgSearchQuery" @input="debouncedEpgSearch()"
           :placeholder="t('label.epg_search')">

    <div x-show="loadingEpg" aria-busy="true" class="loading-center"
         x-text="t('msg.loading_epg')"></div>

    <div x-show="!loadingEpg" class="event-list">
      <template x-for="ev in epgEvents" :key="ev.id">
        <article class="event-row" :class="isLive(ev) ? 'live' : ''"
                 :data-end="ev.end_time" @click="showDetail(ev, ev.channel_name)" role="button">
          <div class="event-meta">
            <div class="event-time"
                 x-text="formatTime(ev.start_time) + ' – ' + formatTime(ev.end_time)"></div>
            <div class="event-progress" x-show="isLive(ev)"
                 :title="t('label.progress', { pct: Math.round(progressPct(ev)) })">
              <div class="event-progress-fill"
                   :style="'width:' + progressPct(ev) + '%'"></div>
            </div>
            <div class="event-channel" x-text="ev.channel_name"></div>
            <span class="event-match" x-show="recsMatch(ev.id) !== undefined"
                  :class="recsMatch(ev.id) >= 0.75 ? 'high' : recsMatch(ev.id) >= 0.5 ? 'mid' : 'low'"
                  x-text="t('label.match', { pct: Math.round((recsMatch(ev.id) || 0) * 100) })"></span>
          </div>
          <div class="event-content">
            <div class="event-title-row">
              <span class="event-title" x-text="ev.title"></span>
            </div>
            <div class="event-desc" x-show="ev.short_desc || ev.long_desc"
                 x-text="ev.short_desc || ev.long_desc"></div>
          </div>
        </article>
      </template>
      <div x-show="epgEvents.length === 0 && !loadingEpg && epgSearchQuery.trim().length >= 2"
           class="empty-state" x-text="t('msg.epg_search_no_results', { q: epgSearchQuery })"></div>
      <div x-show="epgEvents.length === 0 && !loadingEpg && epgSearchQuery.trim().length < 2"
           class="empty-state" x-text="t('msg.no_programmes')"></div>
    </div>
  </main>

  <!-- Admin page -->
  <main class="container" x-show="page==='admin'">
    <div class="page-header">
      <h2 x-text="t('page.admin.title')"></h2>
      <button class="outline" @click="adminRefresh('all')" :aria-busy="adminRefreshing"
              x-text="t('btn.refresh_all')"></button>
      <button class="outline" @click="adminRefresh('epg_full')"
              x-text="t('btn.refresh_epg')"></button>
    </div>
    <p x-show="adminMsg" x-text="adminMsg" class="admin-msg"></p>

    <!-- Receivers list + add form -->
    <div class="admin-section">
      <h3 x-text="t('label.admin_receivers_heading')"></h3>
      <div class="admin-receivers">
        <template x-for="r in receivers" :key="r.name">
          <article class="admin-receiver-card">
            <header>
              <span class="receiver-badge"
                    :class="r.online ? (r.power_state==='on' ? 'online' : 'standby') : (r.power_state==='off' ? 'off' : 'offline')">
                <span x-text="r.location || r.name"></span>
              </span>
              <small x-text="r.name + ' · ' + r.ip"></small>
              <small x-text="r.power_state"></small>
            </header>
            <div class="admin-receiver-flags">
              <span x-show="r.has_genre" class="flag-badge">genre</span>
              <span x-text="t('label.prio', { n: r.priority })" class="flag-badge"></span>
              <span x-text="r.power_method" class="flag-badge"></span>
            </div>
            <footer>
              <button class="outline" @click="receiverPower(r.name, 'wake')"
                      x-show="r.power_method !== 'none'"
                      x-text="t('btn.wake')"></button>
              <button class="outline secondary" @click="receiverPower(r.name, 'sleep')"
                      x-show="r.power_method !== 'none'"
                      x-text="t('btn.sleep')"></button>
              <button class="outline secondary admin-delete-btn" @click="deleteReceiver(r.name)"
                      x-text="t('btn.delete')"></button>
            </footer>
          </article>
        </template>
      </div>

      <!-- Add receiver form -->
      <details class="admin-add-form">
        <summary x-text="t('label.add_receiver')"></summary>
        <div class="admin-add-fields">
          <label><span x-text="t('label.receiver_name')"></span><input x-model="newReceiver.name" placeholder="box1"></label>
          <label><span x-text="t('label.receiver_ip')"></span><input x-model="newReceiver.ip" placeholder="192.168.1.15"></label>
          <label><span x-text="t('label.receiver_location')"></span><input x-model="newReceiver.location" placeholder="Wohnzimmer"></label>
          <label><span x-text="t('label.receiver_priority')"></span><input type="number" x-model.number="newReceiver.priority" min="1" max="99"></label>
          <label><span x-text="t('label.receiver_power_method')"></span>
            <select x-model="newReceiver.power_method">
              <option value="none">none</option>
              <option value="wol">wol</option>
              <option value="intertechno">intertechno</option>
            </select>
          </label>
          <label x-show="newReceiver.power_method === 'wol'"><span x-text="t('label.receiver_wol_mac')"></span>
            <input x-model="newReceiver.wol_mac" placeholder="00:11:22:33:44:55">
          </label>
          <label x-show="newReceiver.power_method === 'intertechno'"><span x-text="t('label.receiver_intertechno_family')"></span>
            <select x-model="newReceiver.intertechno_family">
              <option value="">—</option>
              <option>A</option><option>B</option><option>C</option><option>D</option>
            </select>
          </label>
          <label x-show="newReceiver.power_method === 'intertechno'"><span x-text="t('label.receiver_intertechno_device')"></span>
            <select x-model.number="newReceiver.intertechno_device">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            </select>
          </label>
          <label><span x-text="t('label.receiver_has_genre')"></span>
            <input type="checkbox" role="switch" x-model="newReceiver.has_genre">
          </label>
          <button @click="addReceiver()" :disabled="!newReceiver.name || !newReceiver.ip"
                  x-text="t('btn.add')"></button>
        </div>
      </details>
    </div>

    <!-- Users list + add form -->
    <div class="admin-section">
      <h3 x-text="t('label.admin_users_heading')"></h3>
      <div class="admin-users">
        <template x-for="u in users" :key="u.slug">
          <div class="admin-user-row">
            <strong x-text="u.name"></strong>
            <small x-text="u.slug"></small>
            <button class="outline secondary admin-delete-btn" @click="deleteUser(u.slug)"
                    x-text="t('btn.delete')"></button>
          </div>
        </template>
      </div>
      <details class="admin-add-form">
        <summary x-text="t('label.add_user')"></summary>
        <div class="admin-add-fields">
          <label><span x-text="t('label.user_slug')"></span><input x-model="newUser.slug" placeholder="alice"></label>
          <label><span x-text="t('label.user_name')"></span><input x-model="newUser.name" placeholder="Alice"></label>
          <button @click="addUser()" :disabled="!newUser.slug || !newUser.name"
                  x-text="t('btn.add')"></button>
        </div>
      </details>
    </div>

    <!-- Preferences -->
    <div class="admin-prefs">
      <h3 x-text="t('label.prefs_heading')"></h3>
      <template x-for="u in users" :key="u.slug">
        <div class="admin-pref-row">
          <label>
            <strong x-text="u.name"></strong>
            <textarea rows="3" x-model="prefsDraft[u.slug]"
                      :placeholder="t('label.prefs_placeholder')"></textarea>
          </label>
          <button class="outline" @click="savePreferences(u.slug)"
                  :disabled="prefsSaving === u.slug || !prefsChanged(u.slug)" x-text="t('btn.prefs_save')"></button>
        </div>
      </template>
    </div>

    <div class="admin-stats" x-show="adminStatus">
      <p x-text="t('label.admin_channels', { n: adminStatus && adminStatus.db_channel_count })"></p>
      <p x-text="t('label.admin_epg_events', { n: adminStatus && adminStatus.db_epg_event_count })"></p>
    </div>
  </main>

  <!-- Remote control page -->
  <main class="container" x-show="page==='remote'">
    <div class="page-header">
      <h2 x-text="t('page.remote.title')"></h2>
      <span x-show="remoteMsg" class="remote-feedback" x-text="remoteMsg"></span>
    </div>

    <div class="remote-wrap">

      <!-- Power row -->
      <div class="remote-power-row">
        <button class="outline remote-btn" @click="remoteOn()"       :disabled="remoteSending" x-text="t('btn.remote_on')"></button>
        <button class="outline remote-btn" @click="sendKey('power')" :disabled="remoteSending">⏸ Standby</button>
        <button class="outline secondary remote-btn" @click="remoteOff()" :disabled="remoteSending" x-text="t('btn.remote_off')"></button>
      </div>

      <!-- Main: Vol | D-pad | CH -->
      <div class="remote-mid">

        <div class="remote-vcol">
          <button class="outline remote-btn" @click="sendKey('vol_up')" :disabled="remoteSending">VOL+</button>
          <button class="outline remote-btn" @click="sendKey('mute')"   :disabled="remoteSending">🔇</button>
          <button class="outline remote-btn" @click="sendKey('vol_dn')" :disabled="remoteSending">VOL−</button>
        </div>

        <div class="remote-dpad">
          <button class="outline remote-btn dpad-up"    @click="sendKey('up')"    :disabled="remoteSending">▲</button>
          <button class="outline remote-btn dpad-left"  @click="sendKey('left')"  :disabled="remoteSending">◀</button>
          <button class="outline remote-btn dpad-ok"    @click="sendKey('ok')"    :disabled="remoteSending">OK</button>
          <button class="outline remote-btn dpad-right" @click="sendKey('right')" :disabled="remoteSending">▶</button>
          <button class="outline remote-btn dpad-down"  @click="sendKey('down')"  :disabled="remoteSending">▼</button>
        </div>

        <div class="remote-vcol">
          <button class="outline remote-btn" @click="sendKey('ch_up')" :disabled="remoteSending">CH+</button>
          <div class="remote-btn-spacer"></div>
          <button class="outline remote-btn" @click="sendKey('ch_dn')" :disabled="remoteSending">CH−</button>
        </div>

      </div>

      <!-- Nav row -->
      <div class="remote-nav-row">
        <button class="outline remote-btn" @click="sendKey('menu')" :disabled="remoteSending">☰ Menu</button>
        <button class="outline remote-btn" @click="sendKey('back')" :disabled="remoteSending">↩ Back</button>
      </div>

      <!-- Color buttons -->
      <div class="remote-color-row">
        <button class="remote-btn remote-red"    @click="sendKey('red')"    :disabled="remoteSending">■</button>
        <button class="remote-btn remote-green"  @click="sendKey('green')"  :disabled="remoteSending">■</button>
        <button class="remote-btn remote-yellow" @click="sendKey('yellow')" :disabled="remoteSending">■</button>
        <button class="remote-btn remote-blue"   @click="sendKey('blue')"   :disabled="remoteSending">■</button>
      </div>

      <!-- Screenshot feedback -->
      <div class="remote-screenshot-wrap">
        <div class="remote-screenshot-header">
          <small x-text="remoteScreenshotUrl ? '📺 Live' : (remoteScreenshotLoading ? '📺 …' : '📺 –')"></small>
          <button :class="'remote-btn remote-shot-refresh' + (screenshotPollActive ? ' active' : ' outline')"
                  @click="toggleScreenshotPoll()" :aria-busy="remoteScreenshotLoading">↺</button>
        </div>
        <img class="remote-screenshot" :src="remoteScreenshotUrl" alt=""
             style="display:block;width:100%" x-show="remoteScreenshotUrl" />
      </div>

    </div><!-- /remote-wrap -->
  </main>

  <!-- Programme detail modal -->
  <dialog :open="modalOpen" @click.self="modalOpen=false">
    <article>
      <header>
        <button class="close" @click="modalOpen=false"
                :aria-label="t('btn.close')">✕</button>
        <strong x-text="modalChannel"></strong>
      </header>
      <h3 x-text="modalEvent?.title"></h3>
      <p><small x-text="formatTime(modalEvent?.start_time) + ' – ' + formatTime(modalEvent?.end_time)"></small></p>
      <p x-show="modalEvent?.short_desc" x-text="modalEvent?.short_desc" class="epg-text"></p>
      <p x-text="modalEvent?.long_desc" class="epg-text"
         x-show="modalEvent?.long_desc && modalEvent?.long_desc !== modalEvent?.short_desc"></p>
      <p x-show="modalEvent?.reason" class="modal-reason" x-text="modalEvent?.reason"></p>
      <footer class="modal-footer" x-show="modalEvent?.id">
        <button :class="likedIds.has(modalEvent?.id) ? 'like-btn liked' : 'like-btn outline'"
                @click="toggleLike(modalEvent?.id)"
                x-text="likedIds.has(modalEvent?.id) ? t('btn.unlike') : t('btn.like')"></button>
        <button :class="dislikedIds.has(modalEvent?.id) ? 'dislike-btn disliked' : 'dislike-btn outline'"
                @click="toggleDislike(modalEvent?.id)"
                x-text="dislikedIds.has(modalEvent?.id) ? t('btn.undislike') : t('btn.dislike')"></button>
        <button x-show="modalSref && modalIsLive" class="watch-btn" @click="watchChannel(modalSref); modalOpen=false"
                x-text="t('btn.watch')"></button>
        <button x-show="canRecord()" class="record-btn" @click="recordEvent(); modalOpen=false"
                x-text="t('btn.record')"></button>
      </footer>
    </article>
  </dialog>

</body>
</html>
